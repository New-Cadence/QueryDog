# Alert rules for the checks in ../monitoring, keyed by check name (file name without .sql).
# Loaded read-only by Convoy: change them here and redeploy.
# Severity, description and category come from the `-- severity:`, `-- description:`
# and `-- category:` header at the top of each check's .sql file, not from here.
#   operator    > | >= | = | <  compared with threshold against the check's row count
#   threshold   row count the operator compares against (0 = fire on any rows)
#   forMinutes  how long the condition must hold before an incident opens
#   channels    optional list of notification channel names (Settings > Notification channels)
rules:
  active_parts:
    operator: '>'
    threshold: 0
    forMinutes: 0
  async_insert_errors:
    operator: '>'
    threshold: 0
    forMinutes: 0
