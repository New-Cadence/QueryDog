services:
  querydog:
    build: .
    image: querydog:local
    command: ["server"]
    ports:
      - "3001:3001"
    volumes:
      # The client folder (checks, alert rules, queries, data quality) is read
      # from the repo; mount it so edits apply without rebuilding the image
      - ./clienta:/app/clienta
      # Alerting rules/incidents and notebooks persist here
      - querydog-data:/app/data
      # Mount querydog.yml from current directory (or QUERYDOG_CONFIG override).
      # create_host_path: false tells Docker to fail if the source file is missing
      # instead of silently materialising an empty directory at that path.
      - type: bind
        source: ${QUERYDOG_CONFIG:-./querydog.yml}
        target: /app/querydog.yml
        bind:
          create_host_path: false
    # Lets `host: "host.docker.internal"` in querydog.yml reach a ClickHouse
    # running on the host machine. Docker Desktop provides this name already;
    # on Linux the mapping has to be declared explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  querydog-data:
